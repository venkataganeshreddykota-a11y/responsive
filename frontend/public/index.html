<!DOCTYPE html>
<html lang="en" style="height:100%;">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function () {
        function hasExtensionSource(value) {
          return typeof value === "string" && (
            value.indexOf("chrome-extension://") !== -1 ||
            value.indexOf("moz-extension://") !== -1 ||
            value.indexOf("edge-extension://") !== -1
          );
        }

        function isPlainObject(value) {
          if (!value || typeof value !== "object") return false;
          var proto = Object.getPrototypeOf(value);
          return proto === Object.prototype || proto === null;
        }

        function isProfileNoise(message, source, payload) {
          var payloadName = payload && payload.name;
          var payloadMessage = payload && payload.message;
          var payloadText = String(payload);
          var text = [message, source, payloadName, payloadMessage, payloadText, payload && payload.stack]
            .filter(Boolean)
            .join("\n");
          if (hasExtensionSource(text)) return true;
          if (text.indexOf("[object Object]") === -1) return false;
          if (String(message) === "ERROR" || payloadName === "ERROR") return true;
          if (payloadMessage === "[object Object]" || payloadText === "[object Object]") return true;
          if (String(message) !== "[object Object]") return false;
          if (!isPlainObject(payload)) return true;
          return !(payload.message || payload.stack || payload.response || payload.request);
        }

        function silence(event) {
          if (event.cancelable) event.preventDefault();
          event.stopImmediatePropagation();
        }

        window.addEventListener("error", function (event) {
          if (isProfileNoise(event.message, event.filename, event.error)) silence(event);
        }, true);

        window.addEventListener("unhandledrejection", function (event) {
          if (isProfileNoise(String(event.reason), "", event.reason)) silence(event);
        }, true);

        var previousOnError = window.onerror;
        window.onerror = function (message, source, lineno, colno, error) {
          if (isProfileNoise(message, source, error)) return true;
          if (typeof previousOnError === "function") {
            return previousOnError.apply(this, arguments);
          }
          return false;
        };
      })();
    </script>
    <title>Responsive Tool</title>
  </head>
  <body style="margin:0;padding:0;height:100%;overflow-x:hidden;">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="rt-app" style="height:100%;display:flex;flex-direction:column;"></div>
  </body>
</html>
