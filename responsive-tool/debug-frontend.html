<!DOCTYPE html>
<html>
<head>
    <title>Frontend Debug</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .success { color: green; }
        .error { color: red; }
        pre { background: #f5f5f5; padding: 10px; }
    </style>
</head>
<body>
    <h1>Frontend Diagnostics</h1>
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        async function test(name, fn) {
            try {
                const result = await fn();
                results.innerHTML += `<p class="success">✓ ${name}: ${result}</p>`;
            } catch (err) {
                results.innerHTML += `<p class="error">✗ ${name}: ${err.message}</p>`;
            }
        }
        
        async function runTests() {
            // Test 1: Can we reach the API?
            await test('API Reachable', async () => {
                const res = await fetch('/api/scanner/urls/');
                if (!res.ok) throw new Error(`Status ${res.status}`);
                const data = await res.json();
                return `Got ${data.length} URLs`;
            });
            
            // Test 2: Check React is loaded
            await test('React Available', async () => {
                return typeof React !== 'undefined' ? 'Yes' : 'No (this is expected in production build)';
            });
            
            // Test 3: Check root element
            await test('Root Element', async () => {
                const root = document.getElementById('root');
                return root ? 'Found' : 'Missing';
            });
            
            // Test 4: Console errors
            const errors = [];
            const originalError = console.error;
            console.error = function(...args) {
                errors.push(args.join(' '));
                originalError.apply(console, args);
            };
            
            setTimeout(() => {
                if (errors.length > 0) {
                    results.innerHTML += `<p class="error">Console Errors:</p><pre>${errors.join('\n')}</pre>`;
                } else {
                    results.innerHTML += `<p class="success">✓ No console errors detected</p>`;
                }
            }, 2000);
        }
        
        runTests();
    </script>
</body>
</html>
